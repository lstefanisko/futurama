
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FutureForecast | Neural Oracle 2100</title>
    
    <meta name="description" content="Witness the year 2100. AI-driven predictions with 99.9% neural accuracy.">
    <meta name="keywords" content="future predictions, ai oracle, singularity, gemini ai, 2100 predictions">
    
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#010409">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              orbitron: ['Orbitron', 'sans-serif'],
              inter: ['Inter', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            animation: {
              'scan': 'scan 8s linear infinite',
              'fade-in-slow': 'fade-in 2s ease-out forwards',
            },
            keyframes: {
              scan: {
                '0%': { transform: 'translateY(-100%)', opacity: 0 },
                '10%': { opacity: 0.1 },
                '90%': { opacity: 0.1 },
                '100%': { transform: 'translateY(1000%)', opacity: 0 },
              },
              'fade-in': {
                '0%': { opacity: 0 },
                '100%': { opacity: 1 }
              }
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Stripe SDK bude načítaný dynamicky v komponente pre lepšiu stabilitu -->

    <style>
        :root { --accent: #ffffff; --bg: #000000; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: #f8fafc; overflow-x: hidden; scroll-behavior: smooth; font-size: 16px; }
        .glass { backdrop-filter: blur(20px); background: rgba(0, 0, 0, 0.9); border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
        .glass-panel { background: rgba(255, 255, 255, 0.01); border: 1px solid rgba(255, 255, 255, 0.05); }
        .text-glow { text-shadow: 0 0 40px rgba(255, 255, 255, 0.2); }
        .heading-hero { font-size: clamp(2rem, 8vw, 6rem); font-weight: 900; line-height: 0.85; letter-spacing: -0.05em; }
        .pricing-card { transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1); border-color: rgba(255, 255, 255, 0.05); }
        .pricing-card:hover { transform: translateY(-5px); border-color: rgba(255, 255, 255, 0.4); }
        input[type="range"] { -webkit-appearance: none; height: 1px; background: rgba(255,255,255,0.1); border-radius: 5px; outline: none; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 40px; height: 2px; background: #fff; cursor: pointer; }
        .custom-scrollbar::-webkit-scrollbar { width: 2px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); }
        
        @keyframes reveal {
          from { opacity: 0; transform: translateY(20px); }
          to { opacity: 1; transform: translateY(0); }
        }
        .reveal { animation: reveal 1s ease-out forwards; }
    </style>
