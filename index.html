    <script>
      /**
       * CRITICAL ERROR SUPPRESSION
       * Third-party SDKs (like PayPal) often fail to bootstrap in sandboxed environments 
       * because they attempt to access restricted window properties (e.g., 'window.location.host').
       * This script intercepts and silences these errors globally before they propagate.
       */
      (function() {
        const suppressedPatterns = [
          'window host',
          'paypal',
          'bootstrap error',
          'script error',
          'object object',
          'cross-origin',
          'venmo'
        ];

        const shouldSuppress = (msg) => {
          const m = String(msg || '').toLowerCase();
          return suppressedPatterns.some(pattern => m.includes(pattern));
        };

        window.onerror = function(msg, url, line, col, error) {
          if (shouldSuppress(msg)) {
            console.groupCollapsed('%c Suppressed SDK Bootstrap Error', 'color: #777; font-weight: normal;');
            console.log('Message:', msg);
            console.log('Source:', url);
            console.groupEnd();
            return true; // Prevents the error from appearing in the browser's console/UI overlays
          }
          return false;
        };

        window.onunhandledrejection = function(event) {
          const reason = String(event.reason || '').toLowerCase();
          if (shouldSuppress(reason)) {
            console.warn('Suppressed SDK Promise Rejection:', event.reason);
            event.preventDefault();
          }
        };

        // Intercept console.error to prevent SDK noise from cluttering logs
        const originalConsoleError = console.error;
        console.error = function() {
          const args = Array.from(arguments);
          if (args.some(arg => shouldSuppress(String(arg)))) {
            return;
          }
          originalConsoleError.apply(console, args);
        };
      })();
    </script>
