
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FUTUREFORECAST | Neural Simulation Core</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              accent: '#00f3ff',
              dark: '#050505',
              border: 'rgba(255, 255, 255, 0.1)',
            },
            fontFamily: {
              orbitron: ['Orbitron', 'sans-serif'],
              inter: ['Inter', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            letterSpacing: {
              tightest: '-0.075em',
              widest: '0.4em',
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #00f3ff; }
        * { cursor: crosshair; }
        body { 
          background-color: #000; 
          color: #fff; 
          font-family: 'Inter', sans-serif;
          margin: 0;
          overflow-x: hidden;
        }
        
        /* Professional Technical Grid */
        .raw-grid {
          background-image: 
            linear-gradient(rgba(0, 243, 255, 0.05) 1px, transparent 1px),
            linear-gradient(90deg, rgba(0, 243, 255, 0.05) 1px, transparent 1px);
          background-size: 60px 60px;
          background-attachment: fixed;
        }

        /* Visible Glassmorphism */
        .glass {
          background: rgba(10, 10, 10, 0.85);
          backdrop-filter: blur(40px) saturate(150%);
          border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .glass-panel {
          background: rgba(15, 15, 15, 0.9);
          border: 1px solid rgba(255, 255, 255, 0.1);
          box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        /* Precise Thin Accents */
        .thin-border { border: 0.5px solid rgba(255, 255, 255, 0.15); }
        .accent-border { border: 0.5px solid var(--accent); }
        
        .glow-text {
          text-shadow: 0 0 15px rgba(0, 243, 255, 0.4);
        }

        /* Scanline Animation */
        @keyframes scan {
          0% { transform: translateY(-100%); }
          100% { transform: translateY(100vh); }
        }
        .scanline {
          height: 100px;
          background: linear-gradient(to bottom, transparent, rgba(0, 243, 255, 0.05), transparent);
          position: fixed;
          width: 100%;
          top: 0;
          z-index: 999;
          pointer-events: none;
          animation: scan 12s linear infinite;
        }

        /* Responsive Fixes */
        @media (max-width: 768px) {
          .raw-grid { background-size: 30px 30px; }
        }

        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: var(--accent); }
        
        .reveal-anim {
          animation: reveal 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes reveal {
          from { opacity: 0; transform: translateY(20px); }
          to { opacity: 1; transform: translateY(0); }
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "vite": "https://esm.sh/vite@^7.3.0",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@^2.89.0"
  }
}
</script>
</head>
<body class="raw-grid custom-scrollbar">
    <div class="scanline"></div>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
</body>
</html>
